<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiko – Detection Test Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a; color: #e2e8f0; font-size: 13px; padding: 24px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #7dd3fc; margin-bottom: 4px; }
    .subtitle { color: #64748b; margin-bottom: 20px; font-size: 12px; }
    .summary {
      display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .sum-box {
      background: #1e293b; border-radius: 8px; padding: 10px 18px; text-align: center;
    }
    .sum-num { font-size: 28px; font-weight: 700; }
    .sum-lbl { font-size: 10px; color: #64748b; margin-top: 2px; }
    .pass  { color: #86efac; }
    .fail  { color: #f87171; }
    .warn  { color: #fbbf24; }
    .skip  { color: #64748b; }

    .section { margin-bottom: 28px; }
    .section h2 {
      font-size: 11px; font-weight: 700; color: #475569; text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 10px; padding-bottom: 6px;
      border-bottom: 1px solid #1e293b;
    }
    .row {
      display: grid;
      grid-template-columns: 28px 1fr 110px 1fr;
      gap: 10px; align-items: start;
      padding: 8px 10px; border-radius: 6px; margin-bottom: 4px;
    }
    .row:hover { background: #1e293b; }
    .icon { font-size: 14px; line-height: 1.6; }
    .input-col { line-height: 1.6; }
    .input-text { color: #e2e8f0; unicode-bidi: plaintext; }
    .desc { font-size: 11px; color: #64748b; margin-top: 2px; }
    .expected-col { font-size: 11px; color: #64748b; line-height: 1.6; padding-top: 2px; }
    .result-col { line-height: 1.6; }
    .result-type { font-size: 12px; font-weight: 600; }
    .result-preview { font-size: 11px; color: #7dd3fc; margin-top: 2px; unicode-bidi: plaintext; }
    .result-null { font-size: 12px; color: #475569; }
    .timing { font-size: 10px; color: #334155; }

    .note { background: #1e293b; border-radius: 6px; padding: 10px 14px; margin: 16px 0; font-size: 12px; color: #94a3b8; border-left: 3px solid #3b82f6; }
    .error-box { background: #450a0a; border: 1px solid #f87171; border-radius: 8px; padding: 14px; margin: 16px 0; font-size: 12px; color: #fca5a5; }
    pre { background: #0f172a; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 11px; margin-top: 6px; }

    #run-btn {
      background: #3b82f6; color: #fff; border: none; border-radius: 8px;
      padding: 10px 22px; font-size: 13px; font-weight: 700; cursor: pointer;
      margin-bottom: 24px;
    }
    #run-btn:hover { opacity: 0.85; }
    #run-btn:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
<h1>🦜 Kiko – Detection Test Suite</h1>
<div class="subtitle" id="version-line">Loading…</div>

<button id="run-btn" onclick="runAll()">▶ Run All Tests</button>

<div id="summary" class="summary" style="display:none"></div>
<div id="results"></div>

<script>
// ── 1. Mock Chrome APIs before loading content.js ────────────────
window.__kikoTestMode = true;
window.chrome = {
  storage: {
    local: {
      get: (keys, cb) => { if (cb) cb({}); return Promise.resolve({}); },
      set: () => Promise.resolve(),
    },
    onChanged: { addListener: () => {} },
  },
  runtime: {
    sendMessage: () => Promise.resolve(),
    onMessage:   { addListener: () => {} },
    id: 'test',
  },
};
</script>
<script src="content.js"></script>
<script>
// ── 2. Verify API loaded ──────────────────────────────────────────
const api = window.__kiko;
document.getElementById('version-line').textContent =
  api ? 'content.js loaded · Test API ready' : '⚠ content.js test API not found';

// ── 3. Test definitions ───────────────────────────────────────────
//
// Each test:
//   input       – text passed to analyzeText()
//   expect      – 'hebrew_as_english' | 'english_as_hebrew' | null | 'any'
//   desc        – human-readable note
//   strictMode  – (optional) simulate post-fix strict mode (ms value, e.g. 30000)
//
const TESTS = [

  // ════════════════════════════════════════════════════════
  // A. CASE 2 – English chars on Hebrew keyboard (should detect)
  // ════════════════════════════════════════════════════════
  { section: 'Case 2 – Should detect (English typed, meant Hebrew)' },

  {
    input: 'tbh vhh',
    expect: 'english_as_hebrew',
    desc: '"tbh"=אבי, "vhh"=היי — classic wrong-layout, no common EN bigrams',
  },
  {
    input: 'nv gsgd',
    expect: 'english_as_hebrew',
    desc: '"nv"=מה, "gsgd"=עסגד — pure consonant clusters, not English',
  },
  {
    input: 'hbgud nsh',
    expect: 'english_as_hebrew',
    desc: 'Low bigram English words that map fully to Hebrew chars',
  },
  {
    input: 'vhh jcr akh nv',
    expect: 'english_as_hebrew',
    desc: 'Longer wrong-layout run with multiple eligible words',
  },
  {
    input: 'aku,n hbgud nsh tbh',
    expect: 'english_as_hebrew',
    desc: 'Several Hebrew-candidate words in sequence',
  },

  // ════════════════════════════════════════════════════════
  // B. CASE 2 – Should NOT detect (real English)
  // ════════════════════════════════════════════════════════
  { section: 'Case 2 – Should NOT detect (real English text)' },

  {
    input: 'hello world',
    expect: null,
    desc: 'Both words in EN_WORDS — no detection',
  },
  {
    input: 'this is a test',
    expect: null,
    desc: 'All common English words',
  },
  {
    input: 'i want to go home',
    expect: null,
    desc: 'Common English sentence',
  },
  {
    input: 'ok great sure thanks',
    expect: null,
    desc: 'Affirmations — all in EN_WORDS',
  },
  {
    input: 'the quick brown fox jumps over the lazy dog',
    expect: null,
    desc: 'Classic pangram — all real English',
  },

  // ════════════════════════════════════════════════════════
  // C. CASE 1 – Hebrew chars on English keyboard (should detect)
  // ════════════════════════════════════════════════════════
  { section: 'Case 1 – Should detect (Hebrew chars, meant English)' },

  {
    input: 'ךםםל שלמ',       // "look shal" typed on Hebrew layout
    expect: 'hebrew_as_english',
    desc: '"ךםםל"=look (ך at pos 0 = final-form violation), strong signal',
  },
  {
    input: 'ל,כת יקרק',       // words with final-form violations
    expect: 'hebrew_as_english',
    desc: 'Final-form letters in non-final positions — unambiguous signal',
  },
  {
    input: 'יקרק יקרק יקרק',  // "here here here"
    expect: 'hebrew_as_english',
    desc: '"יקרק"→"here" × 3 — COMMON_EN_WORDS hit, outside strict mode',
  },
  {
    input: 'בוא נראה אם זה עובד',
    expect: 'hebrew_as_english',
    desc: '"cut brtv to zv gucs" — common EN words score, outside strict mode',
  },

  // ════════════════════════════════════════════════════════
  // D. CASE 1 – Should NOT detect (real Hebrew)
  // ════════════════════════════════════════════════════════
  { section: 'Case 1 – Should NOT detect (real Hebrew text)' },

  {
    input: 'שלום',
    expect: null,
    desc: 'Single Hebrew word — wait for more context',
  },
  {
    input: 'שלום חבר',
    expect: null,
    desc: '"שלום חבר" converts to "akun jcr" — no COMMON_EN_WORDS, no violations',
  },
  {
    input: 'היי חבר',
    expect: null,
    desc: '"vhh jcr" — no vowels at all, engScore=0, hasCommonWord=false',
  },
  {
    input: 'אתה עובד טוב עכשיו',
    expect: null,
    desc: '"sha gucs yuc gfahu" — no COMMON_EN_WORDS hit → hasCommonWord=false → no trigger',
  },
  {
    input: 'אני לא יודע מה לעשות',
    expect: null,
    desc: 'Common real Hebrew sentence',
  },
  {
    input: 'הבית הזה גדול מאוד',
    expect: null,
    desc: 'Real Hebrew descriptive sentence',
  },

  // ════════════════════════════════════════════════════════
  // E. STRICT MODE – after a fix, should suppress Case 1 word-scoring
  // ════════════════════════════════════════════════════════
  { section: 'Strict mode – Case 1 word-scoring disabled after Fix' },

  {
    input: 'בוא נראה אם זה עובד',
    strictMode: 30000,
    expect: null,
    desc: 'Same as D4 but IN strict mode — "cut/to" score suppressed → no trigger',
  },
  {
    input: 'ל,כת יקרק',
    strictMode: 30000,
    expect: 'hebrew_as_english',
    desc: 'Final-form violations STILL trigger even in strict mode',
  },
  {
    input: 'ךםםל שלמ',
    strictMode: 30000,
    expect: 'hebrew_as_english',
    desc: '"look" has ך at pos 0 — final-form violation fires in strict mode',
  },
  {
    input: 'יקרק יקרק יקרק',
    strictMode: 30000,
    expect: null,
    desc: '"here×3" — word-score path, suppressed in strict mode',
  },

  // ════════════════════════════════════════════════════════
  // F. SHORT INPUTS – should not trigger on too little text
  // ════════════════════════════════════════════════════════
  { section: 'Short / edge inputs' },

  {
    input: 'hi',
    expect: null,
    desc: 'Too short',
  },
  {
    input: 'ok',
    expect: null,
    desc: 'Too short + in EN_WORDS',
  },
  {
    input: '',
    expect: null,
    desc: 'Empty string',
  },
  {
    input: 'ab',
    expect: null,
    desc: 'Two-char string, below threshold',
  },
  {
    input: 'שלום!',
    expect: null,
    desc: 'Single Hebrew word with punctuation',
  },

  // ════════════════════════════════════════════════════════
  // G. MIXED CONTENT – real scenarios
  // ════════════════════════════════════════════════════════
  { section: 'Mixed content – real-world scenarios' },

  {
    input: 'I want to tell you that היי חבר',
    expect: null,
    desc: 'English sentence + real Hebrew at end — Hebrew portion not wrong-layout',
  },
  {
    input: 'Dear Yossi, בוא נראה אם זה עובד',
    expect: 'hebrew_as_english',
    desc: 'English greeting + Hebrew that converts to common EN words (outside strict mode)',
  },
  {
    input: 'i want to go homeבוא נראה',
    expect: null,
    desc: 'Mixed-script token "homeבוא" — should split at boundary, "home" breaks run1',
  },
];

// ── 4. Runner ─────────────────────────────────────────────────────
function runAll() {
  if (!api) {
    document.getElementById('results').innerHTML =
      '<div class="error-box">⚠ Test API not available. Make sure content.js is loaded correctly and window.__kikoTestMode was set before the script tag.</div>';
    return;
  }

  document.getElementById('run-btn').disabled = true;

  let pass = 0, fail = 0, total = 0;
  const sections = {};
  let curSection = null;

  for (const t of TESTS) {
    if (t.section) { curSection = t.section; sections[curSection] = []; continue; }
    if (!curSection) curSection = 'Uncategorised';
    if (!sections[curSection]) sections[curSection] = [];
    sections[curSection].push(t);
    total++;
  }

  const html = [];

  for (const [sec, tests] of Object.entries(sections)) {
    html.push(`<div class="section"><h2>${esc(sec)}</h2>`);

    for (const t of tests) {
      // Set up strict mode if requested
      api.clearStrictMode();
      api.clearLearned();
      if (t.strictMode) api.setStrictMode(t.strictMode);

      const t0 = performance.now();
      let result = null, err = null;
      try { result = api.analyzeText(t.input); } catch(e) { err = e; }
      const ms = (performance.now() - t0).toFixed(1);

      // Evaluate
      let ok;
      if (err) {
        ok = false;
      } else if (t.expect === 'any') {
        ok = result !== null;
      } else if (t.expect === null) {
        ok = result === null;
      } else {
        ok = result?.type === t.expect;
      }

      if (ok) pass++; else fail++;

      // Result display
      let resultHtml;
      if (err) {
        resultHtml = `<span class="result-type fail">💥 ERROR</span><br><span class="desc fail">${esc(String(err))}</span>`;
      } else if (result === null) {
        resultHtml = `<span class="result-null">— null (no detection)</span>`;
      } else {
        const preview = result.converted ? result.converted.slice(0, 40) + (result.converted.length > 40 ? '…' : '') : '';
        resultHtml = `<span class="result-type ${result.type === 'hebrew_as_english' ? 'warn' : 'pass'}">${esc(result.type)}</span>` +
          (preview ? `<div class="result-preview">"${esc(preview)}"</div>` : '');
      }

      const expectedLabel = t.expect === null ? 'null' : t.expect;
      const strictLabel = t.strictMode ? `<span style="color:#fbbf24;font-size:10px"> ⚡strict</span>` : '';

      html.push(`
        <div class="row">
          <div class="icon">${ok ? '✅' : err ? '💥' : '❌'}</div>
          <div class="input-col">
            <div class="input-text">${esc(t.input || '(empty)')}</div>
            <div class="desc">${esc(t.desc)}</div>
          </div>
          <div class="expected-col">expect: <strong>${esc(expectedLabel)}</strong>${strictLabel}</div>
          <div class="result-col">${resultHtml}<div class="timing">${ms} ms</div></div>
        </div>`);
    }

    html.push('</div>');
  }

  // Cleanup
  api.clearStrictMode();
  api.clearLearned();

  // Summary
  document.getElementById('summary').style.display = 'flex';
  document.getElementById('summary').innerHTML = `
    <div class="sum-box">
      <div class="sum-num" style="color:#e2e8f0">${total}</div>
      <div class="sum-lbl">Total</div>
    </div>
    <div class="sum-box">
      <div class="sum-num pass">${pass}</div>
      <div class="sum-lbl">Passed</div>
    </div>
    <div class="sum-box">
      <div class="sum-num fail">${fail}</div>
      <div class="sum-lbl">Failed</div>
    </div>
    <div class="sum-box">
      <div class="sum-num" style="color:#64748b">${((pass/total)*100).toFixed(0)}%</div>
      <div class="sum-lbl">Pass rate</div>
    </div>
  `;

  document.getElementById('results').innerHTML = html.join('');
  document.getElementById('run-btn').disabled = false;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Auto-run on load
window.addEventListener('load', () => setTimeout(runAll, 100));
</script>
</body>
</html>
