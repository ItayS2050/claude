<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kiko Test Harness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #e2e8f0; font-family: monospace; font-size: 13px; padding: 20px; }
    h1 { color: #7dd3fc; font-size: 18px; margin-bottom: 4px; }
    .subtitle { color: #475569; font-size: 12px; margin-bottom: 20px; }
    .section { margin-bottom: 24px; }
    .section-title { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .test { display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px; border-radius: 6px; margin-bottom: 3px; }
    .test.pass { background: #052e16; }
    .test.fail { background: #2d0a0a; }
    .test.pending { background: #1e293b; }
    .badge { flex-shrink: 0; width: 44px; text-align: center; font-size: 11px; font-weight: 700; padding: 2px 0; border-radius: 4px; }
    .badge.pass { background: #166534; color: #86efac; }
    .badge.fail { background: #7f1d1d; color: #f87171; }
    .badge.pending { background: #334155; color: #94a3b8; }
    .test-name { flex: 1; color: #cbd5e1; }
    .test-detail { color: #64748b; font-size: 11px; margin-top: 2px; }
    .test-got { color: #f87171; font-size: 11px; margin-top: 2px; }
    #summary { margin-top: 20px; padding: 14px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; }
    #summary.all-pass { background: #052e16; color: #86efac; border: 1px solid #166534; }
    #summary.has-fail  { background: #2d0a0a; color: #f87171; border: 1px solid #7f1d1d; }
    #run-btn { margin-bottom: 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 700; cursor: pointer; }
    #run-btn:hover { opacity: 0.85; }
    #run-btn:disabled { background: #334155; color: #64748b; cursor: default; }
  </style>
</head>
<body>
  <h1>🦜 Kiko Test Harness</h1>
  <div class="subtitle" id="version-line">Loading…</div>
  <button id="run-btn">▶ Run All Tests</button>
  <div id="output"></div>
  <div id="summary"></div>

  <script>
    // ── Mock chrome API before loading content.js ────────────────
    window.__kikoTestMode = true;

    const _storage = {
      detectionEnabled: true,
      soundEnabled: false,
      learnedHebrew: [],
      learnedEnglish: [],
      stats: { detected: 0, converted: 0, rejected: 0 }
    };

    window.chrome = {
      storage: {
        local: {
          get(keys, cb) {
            const result = {};
            const arr = Array.isArray(keys) ? keys : (typeof keys === 'string' ? [keys] : Object.keys(keys));
            arr.forEach(k => { if (k in _storage) result[k] = _storage[k]; });
            const p = Promise.resolve(result);
            if (cb) p.then(cb);
            return p;
          },
          set(data, cb) {
            Object.assign(_storage, data);
            const p = Promise.resolve();
            if (cb) p.then(cb);
            return p;
          }
        }
      },
      runtime: {
        sendMessage() { return Promise.resolve(); },
        onInstalled: { addListener() {} },
        onMessage:   { addListener() {} },
        lastError: null
      },
      contextMenus: { create() {}, onClicked: { addListener() {} } },
      tabs: { sendMessage() {} }
    };
  </script>
  <script src="content.js"></script>
  <script>
    // ── Test runner ───────────────────────────────────────────────
    const out     = document.getElementById('output');
    const summary = document.getElementById('summary');
    const btn     = document.getElementById('run-btn');

    let passCount = 0, failCount = 0;
    let currentSection = null;

    function section(title) {
      currentSection = document.createElement('div');
      currentSection.className = 'section';
      currentSection.innerHTML = `<div class="section-title">${title}</div>`;
      out.appendChild(currentSection);
    }

    function test(name, fn) {
      let pass = false, detail = '', got = '';
      try {
        const result = fn();
        if (result && result.pass !== undefined) {
          pass = result.pass;
          detail = result.detail || '';
          got    = result.got    || '';
        } else {
          pass = !!result;
        }
      } catch (e) {
        pass = false; got = `Error: ${e.message}`;
      }
      if (pass) passCount++; else failCount++;

      const row = document.createElement('div');
      row.className = `test ${pass ? 'pass' : 'fail'}`;
      row.innerHTML = `
        <div class="badge ${pass ? 'pass' : 'fail'}">${pass ? 'PASS' : 'FAIL'}</div>
        <div>
          <div class="test-name">${name}</div>
          ${detail ? `<div class="test-detail">${detail}</div>` : ''}
          ${got    ? `<div class="test-got">got: ${got}</div>` : ''}
        </div>`;
      currentSection.appendChild(row);
    }

    function detect(text) {
      if (!window.__kiko) throw new Error('__kiko API not available');
      return window.__kiko.analyzeText(text);
    }

    function detectLines(text) {
      if (!window.__kiko) throw new Error('__kiko API not available');
      return window.__kiko.analyzeByLines(text);
    }

    function expectDetect(text, type) {
      const d = detect(text);
      if (!d) return { pass: false, detail: `"${text.slice(0, 40)}"`, got: 'null (no detection)' };
      if (d.type !== type) return { pass: false, detail: `"${text.slice(0, 40)}"`, got: `type=${d.type}` };
      return { pass: true, detail: `"${text.slice(0, 40)}" → ${d.converted.slice(0, 40)}` };
    }

    function expectNull(text) {
      const d = detect(text);
      if (d) return { pass: false, detail: `"${text.slice(0, 40)}"`, got: `type=${d.type} words=[${d.words.join(',')}]` };
      return { pass: true, detail: `"${text.slice(0, 40)}" → correctly not detected` };
    }

    function runAll() {
      btn.disabled = true;
      out.innerHTML = '';
      summary.textContent = '';
      passCount = 0; failCount = 0;

      if (!window.__kiko) {
        out.innerHTML = '<div style="color:#f87171;padding:16px">ERROR: window.__kiko not available — content.js may have failed to load. Check browser console.</div>';
        btn.disabled = false;
        return;
      }

      window.__kiko.clearLearned();
      window.__kiko.clearStrictMode();

      // ── Case 1: Hebrew chars typed on English keyboard ────────
      section('Case 1 — Hebrew keyboard, meant English (hebrew_as_english)');

      test('Short phrase "שלום" detects (if enough signal)', () => {
        // "שלום" = s,l,o,m → maps to English "slom" — short single word, needs COMMON_EN_WORDS
        // This might or might not detect depending on scoring — just check it doesn't crash
        try { detect('שלום'); return { pass: true, detail: 'did not crash' }; } catch(e) { return false; }
      });

      test('Multi-word Hebrew-on-English detects as hebrew_as_english', () => {
        // 'גםמא ישא' → convertToEnglish → 'dont hat' (dont in COMMON_EN_WORDS, engScore≥3)
        return expectDetect('גםמא ישא', 'hebrew_as_english');
      });

      test('"כן" (yes in Hebrew) should NOT detect — too short', () => {
        return expectNull('כן');
      });

      test('"שלום עולם" real Hebrew should not detect (no EN common words)', () => {
        // "שלום עולם" = hello world in Hebrew → maps to "slom uolm" — not common English words
        const d = detect('שלום עולם');
        if (!d) return { pass: true, detail: 'correctly not detected' };
        // If it detects, check it's not a false positive based on word scoring
        return { pass: false, got: `detected as ${d.type}: [${d.words.join(', ')}]` };
      });

      test('Strong signal (final-form in non-final position) detects', () => {
        // ך (final kaf) at START of word is unambiguous wrong layout
        return expectDetect('ךלה ישא תוד', 'hebrew_as_english');
      });

      test('User text "ן שךדם גםמא למם" detects (from real session)', () => {
        return expectDetect("ן שךדם גםמא למם' 'ישא", 'hebrew_as_english');
      });

      test('User text "ךםםלד ךןלק" detects (from real session)', () => {
        return expectDetect("ךםםלד ךןלק 'ק דאןךך ישהק ןדדוקד", 'hebrew_as_english');
      });

      // ── Case 1 converted text ─────────────────────────────────
      section('Case 1 — Conversion quality');

      test('"ok' maps correctly', () => {
        // Hebrew keyboard: typing "ok" gives "ם" "ך" (or similar) → should convert back to English
        const d = detect('שלום עובד לחלוטין');
        // We can't fully predict what converts, just verify no crash
        return { pass: true, detail: 'did not crash' };
      });

      // ── Case 2: English chars typed on Hebrew keyboard ─────────
      section('Case 2 — English keyboard, meant Hebrew (english_as_hebrew)');

      test('"zv gucs" (זה עובד typed on English keyboard) detects', () => {
        // zv→זה, gucs→עובד — both words pass wordCouldBeHebrew, hebrewCount=2≥minRun
        return expectDetect('zv gucs', 'english_as_hebrew');
      });

      test('"sgk fkuz" detects as english_as_hebrew', () => {
        // sgk→דעל, fkuz→כלוז — no EN_BIGRAMS in either word, both pass wordCouldBeHebrew
        return expectDetect('sgk fkuz', 'english_as_hebrew');
      });

      test('"hello world" real English should NOT detect', () => {
        return expectNull('hello world');
      });

      test('"hey how are you" real English should NOT detect', () => {
        return expectNull('hey how are you');
      });

      test('"the quick brown fox" real English should NOT detect', () => {
        return expectNull('the quick brown fox');
      });

      test('"ok" too short, should NOT detect', () => {
        return expectNull('ok');
      });

      test('"go" too short, should NOT detect', () => {
        return expectNull('go');
      });

      test('Mixed Hebrew+Latin: "ho w sre you" in Hebrew context detected fully', () => {
        // textHasHebrew=true → minRun=1, physicallyMapsToHebrew extension
        // 'ho' passes wordCouldBeHebrew; 'sre' and 'you' extended via physicallyMapsToHebrew
        // findRunSpan preserves intermediate 'w' → original='ho w sre you'
        const d = detect('ho w sre you כן');
        if (!d) return { pass: false, got: 'null — mixed detection failed' };
        if (d.type !== 'english_as_hebrew') return { pass: false, got: `type=${d.type}` };
        const hasAll = d.original.includes('sre') && d.original.includes('you');
        return { pass: hasAll, detail: `original="${d.original}"`, got: hasAll ? '' : 'missing sre or you' };
      });

      test('Context extension: "cut brtv to zv gucs" detects full phrase', () => {
        // 'zv gucs' is the core run; 'cut','brtv','to' extend backward via mapsToHebrew()
        // Result should be 'בוא נראה אם זה עובד'
        const d = detect('cut brtv to zv gucs');
        if (!d) return { pass: false, got: 'null — context extension failed' };
        if (d.type !== 'english_as_hebrew') return { pass: false, got: `type=${d.type}` };
        const allWords = ['cut','brtv','to','zv','gucs'];
        const missing = allWords.filter(w => !d.original.includes(w));
        return { pass: missing.length === 0, detail: `original="${d.original}"`, got: missing.length ? `missing: ${missing.join(',')}` : '' };
      });

      // ── Strict mode (post-fix window) ─────────────────────────
      section('Strict mode — after fix, only strong signals fire');

      test('Real Hebrew "בוא נראה אם זה עובד" should NOT detect in strict mode', () => {
        window.__kiko.setStrictMode(60000); // 60s strict mode
        try {
          const d = detect('בוא נראה אם זה עובד');
          const ok = !d || d.type !== 'hebrew_as_english';
          return { pass: ok, detail: ok ? 'correctly suppressed in strict mode' : '', got: d ? `type=${d.type}` : '' };
        } finally {
          window.__kiko.clearStrictMode();
        }
      });

      test('Strong signal (2+ final-forms in wrong position) DOES detect even in strict mode', () => {
        window.__kiko.setStrictMode(60000);
        try {
          // 'ךלה ןמ': ך(final) at non-final in word 1, ן(final) at non-final in word 2 → badCount=2 → strongSignal=true
          const d = detect('ךלה ןמ');
          return { pass: !!d, detail: d ? `type=${d.type}` : '', got: d ? '' : 'null — should detect via strongSignal (badCount≥2)' };
        } finally {
          window.__kiko.clearStrictMode();
        }
      });

      test('"בוא" alone should NOT detect outside strict mode (single-word, scores poorly)', () => {
        window.__kiko.clearStrictMode();
        // "בוא" = b,o,a → maps to "cut" — COMMON_EN_WORDS, but only one word → needs to pass single-word check
        // Actually "בוא" → "cut" IS in COMMON_EN_WORDS and IS length >= 3, so it MIGHT detect
        // The test here is just that it doesn't crash
        try { detect('בוא'); return { pass: true, detail: 'no crash' }; } catch(e) { return false; }
      });

      // ── False positive guards ─────────────────────────────────
      section('False positive guards');

      test('Pure English text never detected', () => {
        const samples = ['I need to go now', 'what time is it', 'can you help me please', 'this is a test message'];
        for (const s of samples) {
          const d = detect(s);
          if (d) return { pass: false, detail: `"${s}"`, got: `type=${d.type}` };
        }
        return { pass: true, detail: `${samples.length} English phrases — none detected` };
      });

      test('Real Hebrew sentences not false-positive (common words)', () => {
        const samples = ['אני לא יודע', 'מה שלומך', 'הכל בסדר'];
        const fps = [];
        for (const s of samples) {
          const d = detect(s);
          if (d && d.type === 'hebrew_as_english') fps.push(`"${s}"→${d.type}`);
        }
        return { pass: fps.length === 0, got: fps.join(', ') || '', detail: fps.length === 0 ? `${samples.length} Hebrew phrases — none false-positive` : '' };
      });

      test('Mixed Hebrew+English (like "Kiko הוא כלי") not over-detected', () => {
        try { const d = detect('Kiko הוא כלי'); return { pass: true, detail: `type=${d ? d.type : 'null'}` }; } catch(e) { return false; }
      });

      // ── Learned words ─────────────────────────────────────────
      section('Learned word lists');

      test('Setting learned Hebrew words does not crash', () => {
        try {
          window.__kiko.setLearnedHebrew(['שלום', 'תודה']);
          window.__kiko.clearLearned();
          return { pass: true };
        } catch(e) { return { pass: false, got: e.message }; }
      });

      // ── Edge cases ────────────────────────────────────────────
      section('Edge cases');

      test('Empty string returns null', () => {
        return expectNull('');
      });

      test('Whitespace-only returns null', () => {
        return expectNull('   ');
      });

      test('Single character returns null', () => {
        return expectNull('א');
      });

      test('Numbers and punctuation only returns null', () => {
        return expectNull('123!@#');
      });

      test('Very long text does not crash', () => {
        const long = 'בוא נראה '.repeat(300);
        try { detect(long); return { pass: true, detail: '2700-char text processed OK' }; } catch(e) { return false; }
      });

      test('Mixed-script boundary (homeאתה) handled without crash', () => {
        try { detect('homeאתה is here'); return { pass: true }; } catch(e) { return false; }
      });

      test('Apostrophe in word (like "don\'t") handled', () => {
        return expectNull("don't worry about it");
      });

      // ── Apostrophe (w-key) backward extension ─────────────────
      section('Apostrophe w-key — backward span extension (v3.3.29)');

      test('"\'ישא ןד" detects and original includes leading apostrophe', () => {
        // "'ישא ןד" = w-key (apostrophe) + "hat" + "is" → should convert to "what is"
        // The apostrophe at the START must be included in d.original
        const d = detect("'ישא ןד");
        if (!d) return { pass: false, got: 'null — no detection' };
        if (d.type !== 'hebrew_as_english') return { pass: false, got: `type=${d.type}` };
        const hasApostrophe = d.original.startsWith("'");
        const startsWithW   = d.converted.trimStart().startsWith('w');
        return {
          pass: hasApostrophe && startsWithW,
          detail: `original="${d.original}" converted="${d.converted}"`,
          got: !hasApostrophe ? 'original missing apostrophe' : !startsWithW ? 'converted missing w' : ''
        };
      });

      test('Apostrophe mid-word ("it\'s") does NOT bleed into preceding Hebrew span', () => {
        // "it's" ends in apostrophe but a space separates it from Hebrew → space stops backward walk
        const d = detect("it's ישא ןד");
        // Should detect (ישא ןד has ן at non-final) but original must NOT contain "it"
        if (d && d.original.includes("it")) {
          return { pass: false, detail: `original="${d.original}"`, got: 'original includes "it" from preceding word' };
        }
        return { pass: true, detail: d ? `original="${d.original}"` : 'no detection (also ok)' };
      });

      // ── Per-line analysis (v3.3.21) ───────────────────────────
      section('Per-line analysis — each row independent');

      test('Wrong layout on line 2 detected when line 1 is real Hebrew', () => {
        // Line 1: real Hebrew "אני בסדר" — should NOT detect by itself
        // Line 2: wrong-layout "zv gucs" — should detect
        const d = detect("אני בסדר\nzv gucs");
        return { pass: !!d && d.type === 'english_as_hebrew',
          detail: d ? `type=${d.type} original="${d.original}"` : '',
          got: d ? '' : 'null — per-line failed to detect line 2' };
      });

      test('Wrong layout on line 1 detected when line 2 is real Hebrew', () => {
        const d = detect("zv gucs\nאני בסדר");
        return { pass: !!d && d.type === 'english_as_hebrew',
          detail: d ? `type=${d.type} original="${d.original}"` : '',
          got: d ? '' : 'null — per-line failed to detect line 1' };
      });

      test('Multi-line: correct Hebrew on both lines — no detection', () => {
        return expectNull("שלום עולם\nאיך הולך");
      });

      test('Multi-line: wrong layout + real Hebrew same line = Case 2 detected', () => {
        // Mixed line: Hebrew context + latin wrong-layout words
        const d = detect("ho w sre you כן\nאני בסדר");
        return { pass: !!d && d.type === 'english_as_hebrew',
          detail: d ? `original="${d.original}"` : '', got: d ? '' : 'null' };
      });

      test('Per-line original is scoped to wrong-layout line only (not both lines)', () => {
        // analyzeByLines should only include line 2 in the original, NOT line 1
        // Without per-line, original would span both lines: "אני אוהב\nגםמא ישא"
        // With per-line, original = "גםמא ישא" only
        const d = detectLines("אני אוהב\nגםמא ישא");
        if (!d) return { pass: false, got: 'null — detection failed' };
        const includesLine1 = d.original.includes('אני') || d.original.includes('אוהב');
        return {
          pass: !includesLine1,
          detail: `original="${d.original}"`,
          got: includesLine1 ? 'original includes line-1 Hebrew — lines not isolated' : ''
        };
      });

      // ── API surface ───────────────────────────────────────────
      section('API surface');

      test('window.__kiko exists and has all methods', () => {
        const api = window.__kiko;
        const needed = ['analyzeText','analyzeByLines','setStrictMode','clearStrictMode','setLearnedHebrew','clearLearned'];
        const missing = needed.filter(m => typeof api[m] !== 'function');
        return { pass: missing.length === 0, got: missing.length ? `missing: ${missing.join(', ')}` : '' };
      });

      test('analyzeText returns null or object with required fields', () => {
        const d = detect('zv gucs');
        if (!d) return { pass: false, got: 'null for clear Case 2 input' };
        const fields = ['type','original','converted','words','message','btnLabel'];
        const missing = fields.filter(f => !(f in d));
        return { pass: missing.length === 0, got: missing.length ? `missing fields: ${missing.join(', ')}` : '', detail: `type=${d.type}` };
      });

      // ── Final summary ─────────────────────────────────────────
      const total = passCount + failCount;
      summary.className = failCount === 0 ? 'all-pass' : 'has-fail';
      summary.textContent = failCount === 0
        ? `✓ All ${total} tests passed`
        : `✗ ${failCount} failed / ${passCount} passed (${total} total)`;

      btn.disabled = false;
    }

    // Version display
    const verEl = document.getElementById('version-line');
    setTimeout(() => {
      const match = document.documentElement.innerHTML.match(/v(3\.\d+\.\d+)/);
      verEl.textContent = window.__kiko ? `content.js loaded — kiko API ready` : 'WARNING: __kiko API not found';
    }, 100);

    btn.addEventListener('click', runAll);

    // Auto-run on load
    window.addEventListener('load', () => setTimeout(runAll, 200));
  </script>
</body>
</html>
