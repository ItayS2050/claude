<!DOCTYPE html>
<html>
<head><title>Kiko Icon Generator</title></head>
<body>
<p>Generating Kiko icons… check your Downloads folder.</p>
<canvas id="c"></canvas>
<script>
function drawIcon(size) {
  const c = document.getElementById('c');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const s = size / 128; // scale factor

  // Background
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.18);
  ctx.fill();

  // ── Wing (behind body) ──
  ctx.fillStyle = '#15803d';
  ctx.beginPath();
  ctx.ellipse(78*s, 82*s, 22*s, 36*s, 0.5, 0, Math.PI*2);
  ctx.fill();

  // ── Body ──
  ctx.fillStyle = '#16a34a';
  ctx.beginPath();
  ctx.ellipse(56*s, 90*s, 30*s, 34*s, 0, 0, Math.PI*2);
  ctx.fill();

  // ── Head ──
  ctx.fillStyle = '#22c55e';
  ctx.beginPath();
  ctx.arc(54*s, 52*s, 30*s, 0, Math.PI*2);
  ctx.fill();

  // ── Crest feathers ──
  ctx.fillStyle = '#4ade80';
  ctx.beginPath();
  ctx.ellipse(46*s, 22*s, 7*s, 16*s, -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(58*s, 19*s, 6*s, 14*s, 0.1, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(69*s, 24*s, 5*s, 12*s, 0.5, 0, Math.PI*2);
  ctx.fill();

  // ── Upper beak (hooked) ──
  ctx.fillStyle = '#f97316';
  ctx.beginPath();
  ctx.moveTo(72*s, 48*s);
  ctx.quadraticCurveTo(100*s, 46*s, 98*s, 62*s);
  ctx.quadraticCurveTo(96*s, 72*s, 80*s, 70*s);
  ctx.quadraticCurveTo(72*s, 68*s, 72*s, 58*s);
  ctx.closePath();
  ctx.fill();

  // ── Lower beak ──
  ctx.fillStyle = '#ea580c';
  ctx.beginPath();
  ctx.moveTo(72*s, 60*s);
  ctx.quadraticCurveTo(84*s, 62*s, 82*s, 70*s);
  ctx.quadraticCurveTo(74*s, 70*s, 72*s, 66*s);
  ctx.closePath();
  ctx.fill();

  // ── Eye white ──
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(62*s, 44*s, 10*s, 0, Math.PI*2);
  ctx.fill();

  // ── Pupil ──
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.arc(64*s, 45*s, 6*s, 0, Math.PI*2);
  ctx.fill();

  // ── Eye shine ──
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(67*s, 42*s, 2.5*s, 0, Math.PI*2);
  ctx.fill();

  // ── Belly highlight ──
  ctx.fillStyle = '#86efac';
  ctx.beginPath();
  ctx.ellipse(46*s, 88*s, 14*s, 20*s, 0, 0, Math.PI*2);
  ctx.fill();

  return c.toDataURL('image/png');
}

function download(dataURL, filename) {
  const a = document.createElement('a');
  a.href = dataURL; a.download = filename; a.click();
}

[16, 48, 128].forEach((size, i) => {
  setTimeout(() => download(drawIcon(size), `icon${size}.png`), i * 300);
});
</script>
</body>
</html>
