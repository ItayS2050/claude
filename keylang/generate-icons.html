<!DOCTYPE html>
<html>
<head><title>Kiko Icon Generator</title></head>
<body>
<p>Generating Kiko icons… check your Downloads folder.</p>
<canvas id="c"></canvas>
<script>
function drawIcon(size) {
  const c = document.getElementById('c');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');

  // Dark navy background
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.18);
  ctx.fill();

  // Parrot emoji centered
  ctx.font = `${size * 0.72}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🦜', size * 0.5, size * 0.54);

  return c.toDataURL('image/png');
}

function download(dataURL, filename) {
  const a = document.createElement('a');
  a.href = dataURL; a.download = filename; a.click();
}

[16, 48, 128].forEach((size, i) => {
  setTimeout(() => download(drawIcon(size), `icon${size}.png`), i * 300);
});
</script>
</body>
</html>
