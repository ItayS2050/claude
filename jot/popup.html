<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Jot</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0f1117;
    --surface: #171a23;
    --surface-2: #1e222e;
    --line: #272c3a;
    --text: #e7e9ef;
    --muted: #8b93a7;
    --faint: #5b6377;
    --accent: #7c83ff;
    --accent-soft: #2a2d52;
    --danger: #f87171;
    --warn: #fbbf24;
    --ok: #4ade80;
    --work: #38bdf8;
    --personal: #34d399;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fb;
      --surface: #ffffff;
      --surface-2: #f0f2f7;
      --line: #e3e6ee;
      --text: #1c2030;
      --muted: #6b7285;
      --faint: #9aa1b4;
      --accent: #5b60e8;
      --accent-soft: #e8e9ff;
      --danger: #dc2626;
      --warn: #b45309;
      --ok: #16a34a;
      --shadow: 0 8px 24px rgba(15, 20, 40, 0.12);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 384px;
    max-height: 600px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  body.windowed { width: 100%; max-height: none; height: 100vh; }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }

  /* ---------- composer ---------- */
  .composer {
    flex: none;
    padding: 12px 12px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 3;
  }
  .field {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    border-radius: 11px;
    padding: 4px 4px 4px 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field.listening { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(248, 113, 113, .18); }

  #input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    padding: 7px 0;
    font-size: 13.5px;
  }
  #input::placeholder { color: var(--faint); }

  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 9px;
    display: grid; place-items: center;
    color: var(--muted);
    flex: none;
    transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--line); color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; fill: currentColor; }

  #mic.on { color: #fff; background: var(--danger); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, .55); }
    50%      { box-shadow: 0 0 0 7px rgba(248, 113, 113, 0); }
  }

  #add { background: var(--accent); color: #fff; }
  #add:hover { background: var(--accent); filter: brightness(1.12); }
  #add:disabled { opacity: .35; cursor: default; filter: none; }

  /* live read-out of what the parser found */
  .preview {
    display: none;
    gap: 5px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 11px;
  }
  .preview.show { display: flex; }
  .pill {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 2.5px 9px;
    font-weight: 600;
    white-space: nowrap;
  }
  .pill.muted { background: var(--surface-2); color: var(--muted); font-weight: 500; }
  .hint { margin-top: 8px; font-size: 11px; color: var(--faint); }


  /* ---------- work / personal switch ---------- */
  .lanes {
    flex: none;
    display: flex;
    gap: 2px;
    margin: 8px 12px 0;
    padding: 3px;
    background: var(--surface-2);
    border-radius: 10px;
  }
  .lane-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 4px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    transition: background .12s, color .12s, box-shadow .12s;
  }
  .lane-btn:hover { color: var(--text); }
  .lane-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  .lane-btn .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .lane-btn .n { color: var(--faint); font-weight: 600; }
  .dot.work { background: var(--work); }
  .dot.personal { background: var(--personal); }
  .dot.none { background: none; border: 1.5px solid var(--faint); }

  /* the same dot on each row, and the only control needed to correct it */
  .lane-dot {
    width: 18px; height: 24px;
    display: grid; place-items: center;
    flex: none;
    margin-left: -4px;
  }
  .lane-dot i { width: 7px; height: 7px; border-radius: 50%; display: block; transition: transform .12s; }
  .lane-dot:hover i { transform: scale(1.5); }
  .lane-dot i.work { background: var(--work); }
  .lane-dot i.personal { background: var(--personal); }
  .lane-dot i.none { border: 1.5px solid var(--faint); }

  /* ---------- filters ---------- */
  .filters {
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    flex-wrap: wrap;
  }
  .chip {
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface-2);
    white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--accent); color: #fff; }
  .chip .n { opacity: .65; margin-left: 4px; font-weight: 500; }

  #search {
    flex: 1 1 90px;
    min-width: 0;
    background: var(--surface-2);
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11.5px;
    outline: none;
  }
  #search:focus { border-color: var(--accent); }

  /* ---------- list ---------- */
  .list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 0 10px; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .group-head {
    display: flex; align-items: center; gap: 7px;
    padding: 11px 14px 5px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .group-head .count { color: var(--faint); font-weight: 600; letter-spacing: 0; }
  .group-head.overdue { color: var(--danger); }
  .group-head.today { color: var(--accent); }
  .group-head button { color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 8px 12px 8px 14px;
    position: relative;
  }
  .task:hover { background: var(--surface); }
  .task.flash { animation: flash 1.1s ease-out; }
  @keyframes flash {
    from { background: var(--accent-soft); }
    to   { background: transparent; }
  }

  .check {
    width: 17px; height: 17px;
    margin-top: 1px;
    border: 1.8px solid var(--faint);
    border-radius: 6px;
    flex: none;
    display: grid; place-items: center;
    transition: border-color .12s, background .12s;
  }
  .check:hover { border-color: var(--accent); }
  .check svg { width: 11px; height: 11px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .task.done .check { background: var(--ok); border-color: var(--ok); }
  .task.done .check svg { opacity: 1; }
  .task.p1 .check { border-color: var(--warn); }
  .task.p2 .check { border-color: var(--danger); }

  .body { flex: 1; min-width: 0; }
  .title {
    font-size: 13px;
    word-break: break-word;
    cursor: text;
    border-radius: 4px;
  }
  .task.done .title { color: var(--faint); text-decoration: line-through; }
  .title-edit {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 3px 6px;
    outline: none;
    font-size: 13px;
  }

  .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; font-size: 10.5px; align-items: center; }
  .meta:empty { display: none; }
  .due { color: var(--muted); font-weight: 600; cursor: pointer; border-radius: 4px; padding: 1px 4px; margin-left: -4px; }
  .due:hover { background: var(--surface-2); color: var(--text); }
  .due.soon { color: var(--accent); }
  .due.late { color: var(--danger); }
  .tag { color: var(--faint); }
  .tag:hover { color: var(--accent); }
  .rep { color: var(--faint); }

  .actions { display: flex; gap: 1px; opacity: 0; flex: none; transition: opacity .12s; }
  .task:hover .actions, .task:focus-within .actions { opacity: 1; }
  .act {
    width: 24px; height: 24px;
    border-radius: 6px;
    display: grid; place-items: center;
    color: var(--faint);
  }
  .act:hover { background: var(--surface-2); color: var(--text); }
  .act.flag.on { color: var(--warn); }
  .act svg { width: 14px; height: 14px; fill: currentColor; }

  /* inline scheduling row */
  .sched { display: flex; flex-wrap: wrap; gap: 5px; padding: 2px 12px 10px 40px; }
  .sched button, .sched label {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 3px 8px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
  }
  .sched button:hover, .sched label:hover { color: var(--text); border-color: var(--accent); }
  .sched input[type=datetime-local] {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 2px 6px;
    font-size: 11px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) { .sched input[type=datetime-local] { color-scheme: light; } }

  /* ---------- empty + footer ---------- */
  .empty { padding: 34px 26px; text-align: center; color: var(--faint); }
  .empty .big { font-size: 28px; margin-bottom: 8px; }
  .empty p { font-size: 12px; line-height: 1.6; }
  .empty code {
    background: var(--surface-2);
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 11px;
    color: var(--muted);
  }

  .foot {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 12px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    font-size: 11px;
    color: var(--faint);
  }
  .foot button { color: var(--muted); font-size: 11px; border-radius: 6px; padding: 3px 7px; }
  .foot button:hover { background: var(--surface-2); color: var(--text); }

  /* ---------- toast ---------- */
  .toast {
    position: fixed;
    left: 12px; right: 12px; bottom: 42px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    transform: translateY(calc(100% + 56px));
    opacity: 0;
    pointer-events: none;
    transition: transform .22s cubic-bezier(.2,.9,.3,1.2), opacity .18s;
    z-index: 9;
  }
  .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  .toast button { color: var(--accent); font-weight: 700; font-size: 12px; }
  .toast .msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>

<div class="composer">
  <div class="field" id="field">
    <input id="input" dir="auto" autofocus autocomplete="off" spellcheck="false"
           placeholder="What needs doing?  (try “call mom tomorrow at 5”)">
    <button id="mic" class="icon-btn" title="Dictate (Ctrl+M)" aria-label="Dictate">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M18 12a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.09A6 6 0 0 0 18 12Z"/></svg>
    </button>
    <button id="add" class="icon-btn" title="Add (Enter)" aria-label="Add" disabled>
      <svg viewBox="0 0 24 24"><path d="M13 5a1 1 0 1 0-2 0v6H5a1 1 0 1 0 0 2h6v6a1 1 0 1 0 2 0v-6h6a1 1 0 1 0 0-2h-6V5Z"/></svg>
    </button>
  </div>
  <div class="preview" id="preview"></div>
  <div class="hint" id="hint"></div>
</div>

<div class="lanes" id="lanes"></div>

<div class="filters" id="filters"></div>

<div class="list" id="list"></div>

<div class="foot">
  <span id="summary"></span>
  <span style="display:flex;gap:2px">
    <button id="voiceLang" title="Language used for dictation"></button>
    <button id="clearDone" hidden>Clear completed</button>
  </span>
</div>

<div class="toast" id="toast">
  <span class="msg" id="toastMsg"></span>
  <button id="undo">Undo</button>
</div>

<script type="module" src="popup.js"></script>
</body>
</html>
